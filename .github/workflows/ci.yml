name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: lint, types, test, build
    runs-on: ubuntu-latest
    env:
      # runner is only available on a job or a step, not in the workflow env block.
      # Tests already use a temp directory; this is the fallback.
      GAOJIAN_DATA_FILE: ${{ runner.temp }}/weidu-ci-store.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  windows:
    name: npm test on Windows
    runs-on: windows-latest
    env:
      GAOJIAN_DATA_FILE: ${{ runner.temp }}/weidu-ci-store.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test
